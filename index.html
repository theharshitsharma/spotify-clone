<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VibeHub - Your Music Oasis</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <aside class="sidebar">
            <div class="logo">
                <i class="fab fa-spotify"></i>
                <h2>VibeHub</h2>
            </div>
            <nav class="menu">
                <p class="menu-heading">Menu</p>
                <ul>
                    <li><a href="#" class="active"><i class="fas fa-home"></i> Home</a></li>
                    <li><a href="#"><i class="fas fa-compass"></i> Explore</a></li>
                    <li><a href="#"><i class="fas fa-music"></i> Your Library</a></li>
                </ul>
            </nav>
            <nav class="playlist">
                <p class="menu-heading">Playlists</p>
                <ul>
                    <li><a href="#"><i class="fas fa-plus-square"></i> Create Playlist</a></li>
                    <li><a href="#"><i class="fas fa-heart"></i> Liked Songs</a></li>
                </ul>
            </nav>
        </aside>

        <main class="main-content">
            <div class="background-art" id="background-art"></div>
            <header class="header">
                <h1>Curated for You</h1>
                <p>A fresh selection of tracks to match your vibe.</p>
            </header>
            <section class="content">
                <div class="grid-container" id="playlist-grid">
                    </div>
            </section>
        </main>

        <footer class="player">
            <div class="song-info">
                <img id="song-art" src="https://images.pexels.com/photos/1105666/pexels-photo-1105666.jpeg?auto=compress&cs=tinysrgb&w=1260&h=750&dpr=1" alt="Album Art">
                <div class="song-details">
                    <span id="song-title">Welcome to VibeHub</span>
                    <span id="song-artist">Select a song to play</span>
                </div>
            </div>
            <div class="player-center">
                <div class="player-controls">
                    <button class="control-btn" id="shuffle-btn"><i class="fas fa-random"></i></button>
                    <button class="control-btn" id="prev-btn"><i class="fas fa-step-backward"></i></button>
                    <button class="control-btn play-btn" id="play-pause-btn"><i class="fas fa-play-circle"></i></button>
                    <button class="control-btn" id="next-btn"><i class="fas fa-step-forward"></i></button>
                    <button class="control-btn" id="repeat-btn"><i class="fas fa-redo"></i></button>
                </div>
                <div class="progress-container">
                    <span id="current-time">0:00</span>
                    <input type="range" id="progress" class="progress-bar" value="0" min="0" max="100">
                    <span id="duration">0:00</span>
                </div>
            </div>
            <div class="player-right">
                <i class="fas fa-volume-down"></i>
                <input type="range" id="volume-slider" class="volume-bar" value="100" min="0" max="100">
            </div>
        </footer>
    </div>
    <script src="script.js"></script>
</body>
</html>
